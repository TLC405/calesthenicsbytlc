name: POWER quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/power-premium-no-gamification-2026]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing main-branch package-lock is out of sync with package.json.
      # Temporary QA-only install; regenerate/commit lock before production merge.
      - name: Install dependencies (temporary lock reconciliation)
        run: npm install --no-audit --no-fund
      - name: Report lockfile drift
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::warning::Committed package-lock.json is out of sync; npm ci will not work until regenerated lock is committed."
          fi
      - name: Training-history unit tests
        run: npm run test:unit
      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
      - name: Lint (report existing baseline)
        run: npm run lint
        continue-on-error: true
