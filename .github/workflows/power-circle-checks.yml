name: Power Circle checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/realtime-community-likes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Existing main-branch npm lockfile is out of sync with package.json.
      # Install from declared dependencies without mutating the committed lockfile.
      - run: npm install --package-lock=false --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.api.json
      - name: Production build
        run: npm run build

  database-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test database migration and security
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/power_circle_smoke.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE independence_test;'
          psql -h 127.0.0.1 -U postgres -d independence_test -v ON_ERROR_STOP=1 -f supabase/tests/independent_platform_smoke.sql
