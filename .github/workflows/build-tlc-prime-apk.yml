name: Build Supa Strength APK

on:
  push:
    branches: [tlc-prime-apk-v38]
    paths:
      - 'tlc-prime-android/**'
      - '.github/workflows/build-tlc-prime-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKM=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build universal APK
        working-directory: tlc-prime-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp tlc-prime-android/app/build/outputs/apk/debug/app-debug.apk Supa-Strength-v3.10-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Supa-Strength-v3.10-universal
          path: Supa-Strength-v3.10-universal.apk
          if-no-files-found: error
