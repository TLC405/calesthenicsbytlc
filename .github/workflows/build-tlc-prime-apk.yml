name: Build TLC Prime DBZ APK

on:
  push:
    branches: [tlc-prime-apk-v38]
    paths:
      - 'tlc-prime-android/**'
      - '.github/workflows/build-tlc-prime-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build universal APK
        working-directory: tlc-prime-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp tlc-prime-android/app/build/outputs/apk/debug/app-debug.apk TLC-Prime-DBZ-v3.8-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TLC-Prime-DBZ-v3.8-universal
          path: TLC-Prime-DBZ-v3.8-universal.apk
          if-no-files-found: error
