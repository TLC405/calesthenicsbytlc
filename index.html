<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="150+ bodyweight exercises, AI coaching, skill progressions & workout tracking. Train smarter with I Got The Power." />
    <meta name="author" content="I Got The Power" />

    <!-- Premium Google Fonts: Inter (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="POWER" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="I Got The Power – Calisthenics Training" />
    <meta property="og:description" content="150+ bodyweight exercises, AI coaching, skill progressions. Train smarter." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="I Got The Power" />
    <meta name="twitter:description" content="150+ bodyweight exercises, AI coaching, skill progressions." />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Purge the legacy workbox service worker that cached the old login screen.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
      }
      if ("caches" in window) {
        caches.keys().then(keys => Promise.all(keys.filter(k => /workbox|precache|runtime/i.test(k)).map(k => caches.delete(k)))).catch(() => {});
      }
      if (location.pathname === "/auth") location.replace("/library");
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
