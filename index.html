<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      try {
        let theme=localStorage.getItem('power-theme');
        if(!localStorage.getItem('power-vasa-default-v1')){
          if(!theme||theme==='default')theme='vasa';
          localStorage.setItem('power-theme',theme||'vasa');
          localStorage.setItem('power-vasa-default-v1','1');
        }
        if(theme!=='default')document.documentElement.dataset.theme=theme||'vasa';
      } catch {document.documentElement.dataset.theme='vasa';}
    </script>
    <title>TLC's Super Human Strength | Calisthenics Skills &amp; Progressions</title>
    <meta name="description" content="TLC's Super Human Strength helps you measure your skills, explore calisthenics progressions, and choose your own training with optional recommendations." />
    <meta name="author" content="TLC's Super Human Strength" />

    <!-- Premium Google Fonts: Inter (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
