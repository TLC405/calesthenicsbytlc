<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      try {
        let theme=localStorage.getItem('power-theme');
        if(!localStorage.getItem('power-vasa-default-v1')){
          if(!theme||theme==='default')theme='vasa';
          localStorage.setItem('power-theme',theme||'vasa');
          localStorage.setItem('power-vasa-default-v1','1');
        }
        if(theme!=='default')document.documentElement.dataset.theme=theme||'vasa';
      } catch {document.documentElement.dataset.theme='vasa';}
    </script>
    <title>I Got The Power – Calisthenics Training App</title>
    <meta name="description" content="Master human strength with skill-based workouts, clear tutorials and a simple training calendar. Powered by TLC." />
    <meta name="author" content="I Got The Power" />

    <!-- Premium Google Fonts: Inter (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#AD1D32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="POWER" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="I Got The Power – Calisthenics Training" />
    <meta property="og:description" content="Skill workouts, tutorials and your training calendar. Powered by TLC." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="I Got The Power" />
    <meta name="twitter:description" content="Choose a skill, build a workout and plan your training days." />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
