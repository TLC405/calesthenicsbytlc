<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="tlc-build" content="development" />
    <!-- TLC_BOOTSTRAP -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      try {
        let theme=localStorage.getItem('power-theme');
        if(!localStorage.getItem('power-vasa-default-v1')){
          if(!theme||theme==='default')theme='vasa';
          localStorage.setItem('power-theme',theme||'vasa');
          localStorage.setItem('power-vasa-default-v1','1');
        }
        if(theme!=='default')document.documentElement.dataset.theme=theme||'vasa';
      } catch {document.documentElement.dataset.theme='vasa';}
    </script>
    <title>TLC Prime | Strength, Balance &amp; Mobility</title>
    <meta name="description" content="TLC Prime: Train, Lengthen, Control. Explore strength, balance, mobility, yoga-inspired movement and skill progressions." />
    <meta name="author" content="TLC Prime" />

    <!-- Premium Google Fonts: Inter (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PWA Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#AD1D32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spread More TLC" />
    <link rel="icon" type="image/svg+xml" href="/icons/spread-more-tlc.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/tlc-prime-20261115-180.png" />
    <link rel="preload" as="image" href="/brand/spread-tlc-original-20261115.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="TLC Prime | Train, Lengthen, Control" />
    <meta property="og:description" content="Measure your strength, explore skill progressions and choose your next move. Created by TLC." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/tlc-prime-20261115-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TLC Prime" />
    <meta name="twitter:description" content="Know your strength. Master your movement. Train your way with optional progression suggestions." />
    <meta name="twitter:image" content="/icons/tlc-prime-20261115-512.png" />
  </head>

  <body>
    <style>
      #tlc-prime-boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));background:#fafafa;color:#082b4a;transition:opacity .35s ease}
      #tlc-prime-boot.is-leaving{opacity:0;pointer-events:none}
      #tlc-prime-boot .boot-inner{width:100%;max-width:1200px;text-align:center}
      #tlc-prime-boot img{display:block;width:100%;max-height:88dvh;object-fit:contain;background:#fafafa}
      #tlc-prime-boot h1{font:900 clamp(20px,5vw,29px)/1.2 system-ui,sans-serif;letter-spacing:.14em;margin:22px 0 4px}
      #tlc-prime-boot p{font:600 12px/1.5 system-ui,sans-serif;letter-spacing:.14em;margin:0}
      #tlc-prime-boot .boot-track{width:72%;height:6px;background:#fff8e5;border-radius:99px;margin:22px auto 0;overflow:hidden}
      #tlc-prime-boot .boot-track:after{content:'';display:block;width:38%;height:100%;border-radius:99px;background:#c27c28;animation:tlc-prime-loading 1.2s ease-in-out infinite alternate}
      @keyframes tlc-prime-loading{to{transform:translateX(165%)}}
      @media(prefers-reduced-motion:reduce){#tlc-prime-boot{transition:none}#tlc-prime-boot .boot-track:after{animation:none}}
    </style>
    <div id="tlc-prime-boot" role="status" aria-label="Opening TLC Prime">
      <div class="boot-inner">
        <img src="/brand/spread-tlc-original-20261115.jpg" alt="Spread More TLC Oklahoma City artwork" fetchpriority="high" width="1536" height="877" />

      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
