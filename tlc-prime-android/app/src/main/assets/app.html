  if(slow)dlog(slow+' seeks were slow (over 3s)');dlog(`scan ${stopped?'stopped':'done'}: ${out.filter(o=>o.body).length}/${out.length} frames with a body, ${A.reps} reps, ${secs.toFixed(1)}s`);
  A.scan={pts:out,dur,secs,reps:A.reps,stopped};rescore();scanBtn();
  const best=A.res&&A.res.best;if(best){await seekTo(v,best.t);A.last=null;anaFrame(true)}
}
function rescore(){if(!A.scan)return;const pts=A.scan.pts;const body=pts.filter(p=>p.body);
  pts.forEach(p=>{if(p.body){const m=metrics(p.kps);const j=judge(m,A.skill);p.score=j.score;p.checks=j.res.map(r=>r.c);p.key=m[scanKey()]}else{p.score=null;p.checks=null;p.key=null}});
  const scored=body.filter(p=>p.score!=null);const cs=CHECKS[A.skill]||[];
  const checks=cs.map(([label,,,,,cue],i)=>{const v=body.map(p=>p.checks&&p.checks[i]).filter(x=>x!=null);return {label,cue,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});
  const best=scored.length?scored.slice().sort((a,b)=>b.score-a.score)[0]:body.length?body.slice().sort((a,b)=>b.conf-a.conf)[0]:null;
  A.res={frames:pts.length,body:body.length,reps:A.scan.reps,best,avg:scored.length?Math.round(scored.reduce((a,p)=>a+p.score,0)/scored.length):null,checks,secs:A.scan.secs,stopped:A.scan.stopped};
  const r=A.res;anaStatus(!r.body?`Scan ${r.stopped?'stopped':'done'}. No body found in ${r.frames} frames. Film side-on with your whole body in frame, in good light.`:
    r.best&&r.best.score!=null?`Scan ${r.stopped?'stopped':'done'}. Best frame ${r.best.score}/100 at ${r.best.t.toFixed(2)}s · ${r.reps} reps counted.`:
    `Scan ${r.stopped?'stopped':'done'}. Body tracked in ${r.body} of ${r.frames} frames · ${r.reps} reps counted. Pick the skill above to score your form.`);
  renderScan()}
function scanBtn(){const b=document.getElementById('anaScanBtn');if(b)b.innerHTML=A.scanning?'■ Stop scan':'⚡ Scan whole video';const w=document.getElementById('anaProgW');if(w)w.style.display=A.scanning?'':'none'}
function renderScan(){const el=document.getElementById('anaScan');if(!el||!A.scan||!A.res)return;el.style.display='';const r=A.res,pts=A.scan.pts,W=360,H=90,useScore=pts.some(p=>p.score!=null);
  const path=pts.map((p,i)=>{const y=useScore?p.score:(p.body?p.conf*100:null);return y==null?null:`${(i/Math.max(1,pts.length-1)*W).toFixed(1)},${(H-y/100*H).toFixed(1)}`}).filter(Boolean);
  const bi=r.best?pts.indexOf(r.best):-1;const col=r.avg==null?'#5fd4ff':r.avg>=85?'#3ee07a':r.avg>=65?'#ffd400':'#ff5a5a';
  let h=`<div class="dbz" style="color:#5fd4ff;margin-bottom:8px">Scan results${r.stopped?' (stopped early)':''}</div>
  <div class="mgrid"><div class="mt"><b>${r.frames}</b><span>Frames scanned</span></div><div class="mt"><b>${r.frames?Math.round(r.body/r.frames*100):0}%</b><span>Body found</span></div><div class="mt"><b>${r.reps}</b><span>Reps</span></div>
  <div class="mt"><b style="color:${col}">${r.avg==null?'–':r.avg}</b><span>Avg form</span></div><div class="mt"><b>${r.best&&r.best.score!=null?r.best.score:'–'}</b><span>Best frame</span></div><div class="mt"><b>${r.secs.toFixed(0)}s</b><span>Scan time</span></div></div>`;
  if(r.checks.length&&r.body)h+=`<div style="margin-top:10px">${r.checks.map(c=>`<div class="chk ${c.avg==null?'na':c.avg>=.85?'ok':c.avg>=.5?'mid':'bad'}"><i></i><div class="sp"><b>${esc(c.label)}</b>${c.avg!=null&&c.avg<.85?`<div class="muted">${esc(c.cue)}</div>`:''}</div><span>${c.avg==null?'–':Math.round(c.avg*100)+'%'}</span></div>`).join('')}</div>`;
  else if(r.body)h+=`<div class="muted" style="margin-top:10px">Pick the skill to judge above and the scores fill in from this scan. No rescan needed.</div>`;
  if(path.length>1)h+=`<div class="dbz" style="color:#5fd4ff;margin:12px 0 6px">${useScore?'Form over time':'Body tracking over time'} · tap to jump</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="scanchart" onclick="scanSeek(event,this)"><polyline points="${path.join(' ')}" fill="none" stroke="${useScore?'#ffd400':'#5fd4ff'}" stroke-width="2.5"/>${useScore?`<line x1="0" y1="${H*.15}" x2="${W}" y2="${H*.15}" stroke="#3ee07a" stroke-dasharray="4 4" stroke-width="1"/>`:''}${bi>=0?`<line x1="${(bi/Math.max(1,pts.length-1)*W).toFixed(1)}" y1="0" x2="${(bi/Math.max(1,pts.length-1)*W).toFixed(1)}" y2="${H}" stroke="#ff7a00" stroke-width="2"/>`:''}</svg><div class="blbl"><span>0s</span><span style="text-align:right">${A.scan.dur.toFixed(1)}s</span></div>`;
  el.innerHTML=h}
function scanSeek(e,s){const r=s.getBoundingClientRect();const v=document.getElementById('anaV');v.currentTime=(e.clientX-r.left)/r.width*v.duration;A.last=null;setTimeout(()=>anaFrame(true),150)}
function anaTap(e){if(!A.tool)return;const c=document.getElementById('anaC');const r=c.getBoundingClientRect();if(A.pts.length>=3)A.pts=[];A.pts.push({x:e.clientX-r.left,y:e.clientY-r.top});anaFrame(true)}
async function anaDel(id){if(!confirm('Delete this video from the app?'))return;await IDB.del(id);await loadLV();if(A.cur&&A.cur.id===id)anaClose();else render()}
async function anaSet(k,val){if(!A.cur)return;A.cur[k]=val;if(k==='skill')A.skill=val;if(k==='lane'&&LANE2SK[val]){A.cur.skill=LANE2SK[val];A.skill=LANE2SK[val]}if(!A.cur.temp){try{await IDB.put(A.cur);await loadLV()}catch(e){dlog('save failed: '+emsg(e))}}if(A.scan)rescore();render(true);if(k==='lane'&&val)toast('Linked. It now shows in that skill\'s tutorials.')}
// ---------- loading videos: picker, library, share
async function storeVideo(blob,name,opts){opts=opts||{};const id='v'+Date.now()+Math.floor(Math.random()*1000);const rec={id,name:String(name||'My video').replace(/\.[^.]+$/,'').slice(0,40)||'My video',lane:'',skill:'general',date:new Date().toISOString(),blob,dur:0,src:opts.src||''};
  dlog(`video in: ${rec.name} · ${blob.type||'unknown type'} · ${(blob.size/1048576).toFixed(1)} MB${opts.src?' · via '+opts.src:''}`);
  if(!blob.size)throw new Error('the video file is empty (0 bytes)');
  if(blob.size>400*1048576){dlog('over 400 MB: analysing without saving to the library');rec.temp=true;return rec}
  try{await IDB.put(rec);await loadLV()}catch(e){dlog('could not save to library ('+emsg(e)+'), analysing without saving');rec.temp=true}return rec}
async function anaPick(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;toast('Loading video…');
  try{const rec=await storeVideo(f,f.name,{src:'file picker'});anaOpenRec(rec)}catch(e){anaFail('Could not load that video',e)}}
function anaLoadBtn(){if(window.Native&&Native.pickVideo){try{Native.pickVideo();return}catch(e){dlog('native picker failed: '+emsg(e))}}document.getElementById('anaFile').click()}
async function anaOpen(id){let v=null;try{v=(await IDB.all()).find(x=>x.id===id)}catch(e){anaFail('Could not open the video library',e);return}if(!v){toast('That video is no longer in the library.');return}anaOpenRec(v)}
function anaOpenRec(v){if(A.url)URL.revokeObjectURL(A.url);A.cur=v;A.url=URL.createObjectURL(v.blob);A.skill=v.skill||LANE2SK[v.lane]||'general';A.pts=[];A.scan=null;A.res=null;A.reps=0;A.repState=0;A.t=0;A.last=null;A.stat='';A.meta={name:v.name,type:v.blob.type||'?',mb:+(v.blob.size/1048576).toFixed(1)};A.err=null;
  clearTimeout(A.loadT);A.loadT=setTimeout(()=>{const el=document.getElementById('anaV');if(el&&A.cur===v&&el.readyState<1&&!el.error)anaFail('The video is taking too long to open',new Error('no metadata after 12s (readyState '+el.readyState+', networkState '+el.networkState+')'),true)},12000);
  if(tab!=='ana')go('ana');else render()}
function anaLoaded(v){clearTimeout(A.loadT);v.playbackRate=A.rate;A.meta=Object.assign(A.meta||{},{w:v.videoWidth,h:v.videoHeight,dur:+(+v.duration).toFixed(2)});
  const go2=A.t&&A.t<v.duration;dlog(`video ready: ${v.videoWidth}x${v.videoHeight}, ${(+v.duration).toFixed(1)}s`);
  if(!v.videoWidth)anaFail('This video has no picture the phone can decode',new Error('videoWidth 0 (audio-only or unsupported codec)'),true);
  if(go2)seekTo(v,A.t).then(()=>anaFrame(true));else setTimeout(()=>anaFrame(true),60);if(A.autoScan){A.autoScan=false;setTimeout(anaScan,250)}}
function anaVidErr(v){clearTimeout(A.loadT);const e=v.error||{};const code=e.code||0;const why={1:'loading was stopped',2:'a read error',3:'it could not be decoded',4:'its format is not supported by this phone'}[code]||'an unknown error';
  A.err={title:'The video player could not open this clip',detail:`MediaError ${code}: ${why}${e.message?' · '+e.message:''} · type ${(A.cur&&A.cur.blob&&A.cur.blob.type)||'?'}`,hint:code>=3?'This is usually an HEVC (H.265), 8K or HDR clip. In the Samsung Camera go to Settings → Advanced video options and turn off “High efficiency videos” and HDR10+, or film at 1080p. Videos saved from Instagram open fine.':'Try loading the video again.',soft:true};
  dlog('ERROR video: '+A.err.detail);anaErrUI();anaStatus('The video could not be opened.')}
function anaClose(){if(A.url)URL.revokeObjectURL(A.url);A.cancel=true;A.cur=null;A.url=null;A.scan=null;A.res=null;A.meta=null;cancelAnimationFrame(A.raf);render()}
function anaPlay(){const v=document.getElementById('anaV');if(!v)return;if(v.paused){const p=v.play();if(p&&p.catch)p.catch(e=>anaFail('The video would not play',e,true));anaFrame()}else{v.pause()}document.getElementById('anaPB').textContent=v.paused?'▶':'❚❚'}
function anaStep(d){const v=document.getElementById('anaV');v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d));setTimeout(()=>anaFrame(true),120);document.getElementById('anaPB').textContent='▶'}
function anaRate(r){A.rate=r;const v=document.getElementById('anaV');if(v)v.playbackRate=r;document.querySelectorAll('.rchip').forEach(c=>c.classList.toggle('on',+c.dataset.r===r))}
function anaSeek(x){const v=document.getElementById('anaV');v.currentTime=x/1000*v.duration;setTimeout(()=>anaFrame(true),120)}
// ---------- v3.7 Share to Supa Strength (Android share sheet → this app)
async function stShare(){if(!(window.Native&&Native.takeShared))return;let items=[];try{items=JSON.parse(Native.takeShared()||'[]')}catch(e){dlog('share read failed: '+emsg(e))}
  if(!items.length){try{if(Native.shareBusy&&Native.shareBusy())stShareBusy(Native.shareBusy())}catch(e){}return}
  let first=true;for(const it of items){dlog('share in: '+it.type+' '+String(it.name||it.text||it.msg||'').slice(0,90));
    if(it.type==='video'){await shareVideo(it,first);first=false}else if(it.type==='text')shareText(it);else if(it.type==='error'){A.recv=null;A.err={title:'Could not receive that share',detail:it.msg,hint:'Share the video file itself (from Gallery or My Files) to Supa Strength.',soft:true};if(tab!=='ana')go('ana');else render()}}}
function stShareBusy(name){A.recv=name||'video';if(tab!=='ana')go('ana');else render()}
async function shareVideo(it,open){try{const r=await fetch(it.url);if(!r.ok)throw new Error('HTTP '+r.status+' reading shared file');let b=await r.blob();if(it.mime&&b.type!==it.mime)b=new Blob([b],{type:it.mime});
    const rec=await storeVideo(b,it.name||'Shared video',{src:it.from||'share'});try{Native.release&&Native.release(it.url.split('/').pop())}catch(e){}
    A.recv=null;if(open){A.autoScan=true;anaOpenRec(rec);toast('Video received. Scanning your form…')}else{toast('Saved to your video library.');if(tab==='ana'&&!A.cur)render()}}
  catch(e){A.recv=null;if(tab!=='ana')go('ana');else render();anaFail('Could not open the shared video',e)}}
function shareText(it){const s=String((it.text||'')+' '+(it.subject||''));const url=(s.match(/https?:\/\/[^\s"'<>]+/i)||[''])[0];const code=/instagram\.com/i.test(url)?parseCode(url):null;A.recv=null;
  if(code){S.shared=S.shared||[];const k=/\/p\//i.test(url)?'p':'reel';const ex=S.shared.findIndex(x=>x.c===code);if(ex>=0)S.shared.splice(ex,1);S.shared.unshift({c:code,k,at:new Date().toISOString()});S.shared=S.shared.slice(0,30);save();A.notice={type:'ig',code};if(A.cur)anaClose();if(tab!=='ana')go('ana');else render();toast('Reel saved to Shared reels.');return}
  A.notice={type:'other',host:url?(url.match(/^https?:\/\/([^/?#]+)/i)||[,''])[1].replace(/^www\./,''):''};if(tab!=='ana')go('ana');else render()}
function rmShared(c){S.shared=(S.shared||[]).filter(x=>x.c!==c);save();if(A.notice&&A.notice.code===c)A.notice=null;render(true)}
function sharedToSkill(c,l){if(!l)return;S.myReels[l]=S.myReels[l]||[];if(!S.myReels[l].includes(c))S.myReels[l].unshift(c);save();toast('Added to '+((D.lanes.find(x=>x.id===l)||{}).name||'that skill')+' tutorials.')}
const SHARE_HOW=`<b>Want an AI form check on a reel?</b><div class="muted" style="margin-top:4px;line-height:1.55">Instagram doesn't let other apps pull the video out of a link. So: in Instagram tap <b>⋯</b> on the reel → <b>Download</b> (or screen-record it). Then open the video in Gallery, tap <b>Share → Supa Strength</b>. The scouter opens it and scans it automatically.</div>`;

    <input type="file" id="anaFile" accept="video/*" style="display:none" onchange="anaPick(this)"><button class="btn p" style="margin-top:14px;width:100%" onclick="anaLoadBtn()">＋ Load video</button></div>`;

    if(!sh.length)h+=`<div class="card sharehow">${SHARE_HOW}</div>`;
    h+=`<div class="card"><div class="dbz" style="color:#ffd400;margin-bottom:6px">Filming tips for best results</div><div class="muted" style="line-height:1.6">• Side-on view for planche, levers, L-sit and pull-ups; front or side for handstands<br>• Whole body in frame, phone steady at hip height<br>• Good light, fitted clothes<br>• Link a clip to a skill and it plays inside that skill's tutorials, with no internet needed</div></div>`;
    h+=diagBlock();M(h);anaErrUI();return;
  }
  const old=document.getElementById('anaV');if(old&&old.currentTime)A.t=old.currentTime;
  const v=A.cur;

  <input type="range" id="anaT" min="0" max="1000" value="0" oninput="anaSeek(this.value)" class="scrub">

  <div class="ctrls"><button class="btn icon" onclick="anaStep(-1/30)" aria-label="Back one frame">⏮</button><button class="btn p" id="anaPB" style="flex:1" onclick="anaPlay()">▶</button><button class="btn icon" onclick="anaStep(1/30)" aria-label="Forward one frame">⏭</button></div>
  <div class="chips" style="margin-top:8px">${[0.25,0.5,1].map(r=>`<div class="chip rchip ${A.rate===r?'on':''}" data-r="${r}" onclick="anaRate(${r})">${r}x</div>`).join('')}<div class="chip ${A.loop?'on':''}" onclick="A.loop=!A.loop;const x=document.getElementById('anaV');if(x)x.loop=A.loop;this.classList.toggle('on',A.loop)">Loop</div><div class="chip ${A.pose?'on':''}" id="chPose" onclick="anaPoseToggle()">AI pose</div><div class="chip ${A.tool?'on':''}" onclick="A.tool=!A.tool;A.pts=[];render(true)">Angle tool</div></div>
  <div class="card"><div class="row"><div class="sp"><div class="muted">Skill to judge</div><select onchange="anaSet('skill',this.value)">${SKILLS.map(s=>`<option value="${s[0]}" ${A.skill===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div><div class="sp"><div class="muted">Show in tutorials for</div><select onchange="anaSet('lane',this.value)"><option value="">Not linked</option>${D.lanes.map(l=>`<option value="${l.id}" ${v.lane===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div></div>
  <button class="btn g" id="anaScanBtn" style="width:100%;margin-top:12px" onclick="anaScan()">${A.scanning?'■ Stop scan':'⚡ Scan whole video'}</button><div class="scanprog" id="anaProgW" ${A.scanning?'':'style="display:none"'}><i id="anaProg"></i></div><div class="muted" id="anaStat" style="margin-top:8px">${A.stat?esc(A.stat):A.det?'AI scouter online ('+A.backend+').':'Turn on AI pose for live tracking, or scan the whole clip.'}${v.temp?' This clip is not saved to the library.':''}</div></div>
  <div class="card" id="anaScan" ${A.res?'':'style="display:none"'}></div>
  <div class="card"><div class="dbz" style="color:#5fd4ff;margin-bottom:8px">Scouter readout</div><div id="anaRead"><div class="muted">Turn on AI pose, then play or step through the video.</div></div></div>
  <button class="btn" style="width:100%" onclick="anaClose()">← Video library</button>`+diagBlock();
  M(h);anaErrUI();if(A.res)renderScan();
}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.chip,.set,.vcard,.lane,.pn,nav button');if(!b)return;b.classList.add('tap');const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);const d=document.createElement('span');d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),500);if(navigator.vibrate)navigator.vibrate(8)},true);

window.onBack=function(){const m=document.getElementById('modal');if(m.classList.contains('on')){closeM();return 1}if(tab==='ana'&&A.cur){anaClose();return 1}if(tab!=='home'){go('home');return 1}return 0};

if(!S.init){S.current={handstand:'H1',planche:'P2',compression:'C1',human_flag:'FL1'};S.passed={F1:'start',P1:'start'};S.init=1;save()}
