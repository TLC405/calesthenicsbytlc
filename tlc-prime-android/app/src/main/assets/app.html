<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07091a">
<title>Supa Strength</title>
<style>
:root{--bg:#0b0d12;--bg2:#10131a;--card:#161a23;--card2:#1e2330;--line:#262c3a;--tx:#f4f6fa;--mut:#8d95a5;--acc:#ff9f2e;--acc2:#ff5e62;--ok:#2fd389;--blue:#4c8dff;--lock:#3a4152;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,-apple-system,Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
button,.btn,.chip,.finder-chip,.blip,[role="button"]{touch-action:manipulation}
button:active,.btn:active,.chip:active,.finder-chip:active,.blip:active,[role="button"]:active{transform:scale(.965)!important;filter:brightness(1.08)}
header{position:sticky;top:0;z-index:5;padding:16px 18px 12px;background:linear-gradient(180deg,var(--bg) 70%,rgba(11,13,18,0));}
.htop{display:flex;align-items:flex-end;gap:10px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
main{padding:4px 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.btn{min-height:44px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
.btn.g{background:var(--ok);border:0;color:#06261a}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn.icon{width:44px;padding:0}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;color:var(--mut);min-height:40px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
.muted{color:var(--mut);font-size:13px}
/* hero */
.hero{border-radius:24px;padding:20px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,94,98,.35),transparent 60%),linear-gradient(135deg,#2a1a10,#171b26 70%);border:1px solid #3a2a1e;margin-bottom:12px;position:relative;overflow:hidden}
.hero .k{font-size:12px;font-weight:800;letter-spacing:.1em;color:#ffc58a;text-transform:uppercase}
.hero .t{font-size:24px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.hero .d{color:#d6c7b8;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800}.stat span{font-size:12px;color:var(--mut)}
.week{display:flex;gap:6px}
.wd{flex:1;text-align:center;border-radius:12px;padding:8px 0;background:var(--card2);font-size:12px;color:var(--mut);font-weight:700}
.wd b{display:block;font-size:15px;color:var(--tx);margin-top:2px}
.wd.rest b{color:var(--mut)}.wd.today{outline:2px solid var(--acc)}.wd.done{background:rgba(47,211,137,.15)}.wd.done b{color:var(--ok)}
/* lane rings */
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lane{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.lane .n{font-weight:800;font-size:14px}.lane .c{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{flex:none}
/* exercise */
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .3s}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:opacity .2s}
.ex.done{opacity:.5}
.ex .nm{font-weight:800;font-size:16px;line-height:1.25}
.ex .ds{color:var(--acc);font-weight:800;font-size:13px;margin-top:3px}
.ex .nt{color:var(--mut);font-size:13px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--card2);color:var(--mut);margin-top:8px}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--lock);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut);transition:all .15s}
.set.on{background:var(--ok);border-color:var(--ok);color:#06261a;transform:scale(1.05)}
/* video */
.vid{margin-top:12px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.vid iframe{display:block;width:100%;aspect-ratio:9/19;max-height:82vh;border:0;background:#fff}
.vid .play{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-size:15px;font-weight:600}
.vid .ig{display:block;text-align:center;padding:8px;font-size:13px;color:#9aa4b2;text-decoration:none}
.vidbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--card2);font-size:12px;color:var(--mut)}
.vidbar a{color:var(--acc);font-weight:700;text-decoration:none;margin-left:auto}
.igbtn{background:linear-gradient(135deg,#833ab4,#fd1d1d 60%,#fcb045);border:0;color:#fff}
.vcard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.vthumb{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#833ab4,#fd1d1d 60%,#fcb045);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.vcard .t{font-weight:700;font-size:14px;line-height:1.3}.vcard .s{font-size:12px;color:var(--mut);margin-top:2px}
/* skill path */
.path{position:relative;padding-left:8px}
.pn{position:relative;display:flex;gap:14px;align-items:stretch;padding-bottom:12px}
.pn:before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--line);border-radius:3px}
.pn:last-child:before{display:none}
.pn.passed:before{background:var(--ok)}
.dot{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;background:var(--card2);border:2px solid var(--lock);color:var(--mut);z-index:1}
.pn.passed .dot{background:var(--ok);border-color:var(--ok);color:#06261a}
.pn.open .dot{border-color:var(--acc);color:var(--acc)}
.pn.cur .dot{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;box-shadow:0 0 0 6px rgba(255,159,46,.18)}
.pbody{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pn.cur .pbody{border-color:var(--acc)}
.pn.locked .pbody{opacity:.6}
.pbody .t{font-weight:800}.pbody .u{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4}
.badge{font-size:12px;font-weight:900;letter-spacing:.06em;padding:4px 7px;border-radius:7px;background:var(--card2);color:var(--mut)}
.badge.ok{background:rgba(47,211,137,.18);color:var(--ok)}.badge.cur{background:rgba(255,159,46,.2);color:var(--acc)}.badge.v{background:rgba(253,29,29,.15);color:#ff7a7a}
/* sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 30px;border-top:1px solid var(--line);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--lock);margin:4px auto 14px}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.sheet ul{margin:0;padding-left:18px}.sheet li{margin:5px 0;font-size:15px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
input{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;min-height:44px;width:100%}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(16,19,26,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:6px 0;font-size:12px;font-weight:700;border-radius:14px;min-height:54px}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px}
nav button.on{color:var(--tx)}nav button.on svg{color:var(--acc)}
/* timer */
#timer{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#1f2533,#171b26);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:none;z-index:10;box-shadow:0 12px 30px rgba(0,0,0,.5);align-items:center;gap:12px}
#timer.on{display:flex}
#tnum{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ok);color:#06261a;padding:12px 18px;border-radius:14px;font-weight:800;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.hist:last-child{border:0}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.bars div{flex:1;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:6px 6px 3px 3px;min-height:4px;position:relative}
.bars div.z{background:var(--card2)}
.blbl{display:flex;gap:6px}.blbl span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}

/* ===== SAIYAN THEME ===== */
:root{--bg:#07091a;--bg2:#0d1130;--card:#121738;--card2:#1b2250;--line:#2a3470;--tx:#fff8e7;--mut:#9fa9d6;--acc:#ff7a00;--acc2:#ffd400;--ok:#3ee07a;--blue:#2f6bff;--ki:#5fd4ff;--lock:#323b78;--gi:#ff7a00;--giB:#1d3fb8;--aura:#ffd400}
html,body{background:#07091a}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(47,107,255,.25),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,122,0,.18),transparent 60%),#07091a;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe3ff,transparent),radial-gradient(1.4px 1.4px at 170px 60px,#fff6c8,transparent),radial-gradient(1px 1px at 240px 200px,#fff,transparent),radial-gradient(1px 1px at 320px 90px,#bcd4ff,transparent);background-size:360px 260px;animation:stars 90s linear infinite}
@keyframes stars{to{background-position:0 2600px}}
main,header{position:relative;z-index:1}
.dbz{font-family:"Impact","Arial Black","Roboto Condensed",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
h1{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-weight:900;font-size:28px;letter-spacing:.01em;color:#ffd400;-webkit-text-stroke:1.2px #b23a00;text-shadow:0 3px 0 #7a1d00,0 0 18px rgba(255,170,0,.45)}
header{background:linear-gradient(180deg,#07091a 70%,rgba(7,9,26,0))}
.sub{color:#9fb4ff;font-weight:700}
.card,.stat,.lane,.ex,.pbody,.sec,.vcard{background:linear-gradient(160deg,#151b45,#0f1435);border:1px solid #2a3470;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 6px 18px rgba(0,0,0,.35)}
.btn{border-radius:12px;font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-weight:900;transform:skewX(-6deg)}
.btn>*{transform:skewX(6deg)}
.btn.p{background:linear-gradient(180deg,#ffb000,#ff6a00 55%,#d63a00);color:#fff;text-shadow:0 2px 0 #8a2400;box-shadow:0 0 0 2px #ffd400 inset,0 6px 0 #8a2400,0 10px 24px rgba(255,120,0,.45)}
.btn.g{background:linear-gradient(180deg,#5fd4ff,#2f6bff 60%,#1d3fb8);color:#fff;text-shadow:0 2px 0 #0b1f6b;box-shadow:0 0 0 2px #a8ecff inset,0 6px 0 #0b1f6b,0 10px 28px rgba(95,212,255,.5)}
.btn:active{transform:skewX(-6deg) scale(.96)}
.chip{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-weight:900;letter-spacing:.03em;background:#121738;border-color:#2a3470;color:#9fa9d6}
.chip.on{background:linear-gradient(180deg,#ffb000,#ff6a00);border-color:#ffd400;color:#fff;text-shadow:0 1px 0 #8a2400;box-shadow:0 0 14px rgba(255,150,0,.5)}
.lbl{font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:15px;color:#ffd400;letter-spacing:.06em;text-shadow:0 2px 0 #7a1d00;display:flex;align-items:center;gap:8px}
.lbl:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#ff7a00,transparent)}
/* hero = aura */
.hero{background:radial-gradient(90% 120% at 50% 120%,var(--hero-a,rgba(255,212,0,.55)),transparent 60%),linear-gradient(180deg,#0e1440,#1a0f2e);border:2px solid var(--hero-b,#ffd400);box-shadow:0 0 0 2px #000 inset,0 0 30px var(--hero-g,rgba(255,200,0,.35));min-height:210px}
.hero:before{content:"";position:absolute;left:50%;bottom:-40px;width:260px;height:320px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 80%,var(--hero-a,rgba(255,212,0,.7)),transparent 65%);filter:blur(6px);animation:aura 1.1s ease-in-out infinite alternate;pointer-events:none}
.hero:after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,.07) 0 2deg,transparent 2deg 9deg);pointer-events:none;animation:spin 30s linear infinite}
@keyframes aura{from{transform:translateX(-50%) scaleY(.92);opacity:.7}to{transform:translateX(-50%) scaleY(1.08);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero>*{position:relative;z-index:1}
.hero .k{color:#ffe680;font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:13px}
.hero .t{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-size:30px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 3px 0 #000,0 0 22px var(--hero-g,rgba(255,200,0,.8))}
.hero .d{color:#dfe6ff}
.form{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--hero-b,#ffd400);font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:13px;color:var(--hero-b,#ffd400);letter-spacing:.05em;text-transform:uppercase}
.emblem{position:absolute;right:14px;top:14px;width:58px;height:58px;border-radius:50%;background:#fff8e7;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#d61f1f;font-family:serif;box-shadow:0 0 0 3px var(--gi),0 4px 12px rgba(0,0,0,.5);z-index:2}
/* scouter */
.scouter{position:relative;border-radius:18px;padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,rgba(0,255,140,.08),rgba(0,40,20,.6));border:1px solid rgba(60,255,150,.45);box-shadow:inset 0 0 30px rgba(0,255,120,.12);overflow:hidden;font-family:"Courier New",monospace;color:#7dffb0}
.scouter:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,120,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.scouter:after{content:"";position:absolute;left:0;right:0;height:40px;top:-40px;background:linear-gradient(180deg,transparent,rgba(120,255,180,.18),transparent);animation:scan 3.2s linear infinite}
@keyframes scan{to{top:110%}}
.scouter .pl{font-size:38px;font-weight:900;letter-spacing:.04em;text-shadow:0 0 12px rgba(80,255,160,.8)}
.scouter .cap{font-size:12px;letter-spacing:.2em;opacity:.8}
.scouter .ret{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:62px;height:62px;border:2px solid rgba(125,255,176,.7);border-radius:50%}
.scouter .ret:before,.scouter .ret:after{content:"";position:absolute;background:rgba(125,255,176,.7)}
.scouter .ret:before{left:50%;top:-8px;bottom:-8px;width:1px}.scouter .ret:after{top:50%;left:-8px;right:-8px;height:1px}
.over9000{display:inline-block;margin-top:4px;color:#ff4d4d;font-weight:900;letter-spacing:.08em;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.plbar{height:8px;border-radius:9px;background:rgba(0,0,0,.4);margin-top:8px;overflow:hidden;border:1px solid rgba(125,255,176,.3)}
.plbar i{display:block;height:100%;background:linear-gradient(90deg,#3ee07a,#c6ff6b);box-shadow:0 0 10px #3ee07a}
/* dragon balls week */
.week{gap:4px}
.wd{background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9fa9d6;font-family:"Impact","Arial Black",sans-serif;font-style:italic}
.orb{width:38px;height:38px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#fff6 0 10%,transparent 11%),radial-gradient(circle at 50% 55%,#5a4a2a,#2a2214 70%);border:1px solid #000;box-shadow:inset 0 -4px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:0 1px;padding:6px}
.orb s{display:block;width:7px;height:7px;background:#4a1a1a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);text-decoration:none}
.wd.done .orb{background:radial-gradient(circle at 35% 30%,#fff 0 9%,transparent 10%),radial-gradient(circle at 50% 55%,#ffcc33,#ff8a00 60%,#c95100);box-shadow:0 0 14px rgba(255,170,0,.85),inset 0 -4px 8px rgba(150,40,0,.5);animation:glow 1.6s ease-in-out infinite alternate}
.wd.done .orb s{background:#d61f1f}
@keyframes glow{to{box-shadow:0 0 24px rgba(255,200,0,1),inset 0 -4px 8px rgba(150,40,0,.5)}}
.wd.today .orb{outline:2px dashed #5fd4ff;outline-offset:3px}
.wd.rest .orb{opacity:.45}
.wd b{font-size:11px;color:#9fa9d6;margin:0}.wd.done b{color:#ffd400}
.shenron{margin-top:10px;font-family:"Impact","Arial Black",sans-serif;font-style:italic;color:#3ee07a;text-align:center;text-shadow:0 0 12px rgba(62,224,122,.8)}
/* Dragon Radar */
.dragon-radar-shell{max-width:340px;margin:4px auto 8px;padding:14px 14px 18px;border-radius:32px;background:#f0c82f;border:3px solid #171717;box-shadow:inset 0 -9px 0 #c89d16,inset 0 3px 0 #fff2a0,0 12px 26px rgba(0,0,0,.42);position:relative}
.dragon-radar-shell:before,.dragon-radar-shell:after{content:"";position:absolute;top:54px;width:13px;height:76px;background:#333;border:3px solid #111}
.dragon-radar-shell:before{left:-11px;border-radius:9px 0 0 9px}.dragon-radar-shell:after{right:-11px;border-radius:0 9px 9px 0}
.radar-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 10px;color:#1e1a0b;font:900 11px/1 "Courier New",monospace;letter-spacing:.08em}
.radar-led{width:9px;height:9px;border-radius:50%;background:#e23b24;box-shadow:0 0 0 2px #6a170f,0 0 10px rgba(226,59,36,.55);display:inline-block;margin-right:5px}
.radar{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(113,255,142,.13),transparent 45%),#082d18;border:8px solid #343b35;box-shadow:0 0 0 3px #111,inset 0 0 0 2px #6e806d,inset 0 0 38px rgba(0,0,0,.75);overflow:hidden}
.radar .rings{position:absolute;inset:10%;border:1px solid rgba(110,255,150,.22);border-radius:50%;box-shadow:0 0 0 34px rgba(110,255,150,.055),0 0 0 68px rgba(110,255,150,.04)}
.radar .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(80,255,140,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(80,255,140,.13) 1px,transparent 1px);background-size:12.5% 12.5%}
.radar .cross:before,.radar .cross:after{content:"";position:absolute;background:rgba(120,255,160,.3)}.radar .cross:before{left:50%;top:5%;bottom:5%;width:1px}.radar .cross:after{top:50%;left:5%;right:5%;height:1px}
.radar .sweep{position:absolute;inset:-1px;background:conic-gradient(from 0deg,rgba(110,255,150,.44),rgba(110,255,150,.08) 12%,transparent 22%);animation:spin 2.8s linear infinite;border-radius:50%;filter:drop-shadow(0 0 4px #5cff8e)}
.radar .me{position:absolute;left:50%;top:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid #ff3b3b;transform:translate(-50%,-55%);filter:drop-shadow(0 0 4px #ff3b3b)}
.blip{position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff 0 12%,#ffe36b 13% 26%,#ff9d00 58%,#d85400 100%);box-shadow:0 0 8px #ffd400,0 0 16px rgba(255,170,0,.8);animation:radarping 1.25s ease-in-out infinite;z-index:4}
.blip:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(255,220,70,.65);border-radius:50%;animation:ripple 1.25s ease-out infinite}
.blip.done{background:radial-gradient(circle at 36% 30%,#fff 0 12%,#baffc7 13% 28%,#44ea78 58%,#148c42 100%);box-shadow:0 0 9px #5fff9a,0 0 18px rgba(62,224,122,.85)}
.blip span{position:absolute;left:50%;top:22px;transform:translateX(-50%);font:900 9px/1 "Courier New",monospace;color:#caffd5;text-shadow:0 1px 3px #000;white-space:nowrap}
.radar-stars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#b31717;letter-spacing:-1px;font-weight:900;text-shadow:none}
.radar-controls{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 5px 0}
.radar-readout{background:#2a2a24;border:2px solid #111;border-radius:10px;padding:8px 10px;color:#78ff9a;font:900 12px/1.25 "Courier New",monospace;box-shadow:inset 0 0 12px #000}
.radar-btn{width:48px;height:48px;border-radius:50%;border:3px solid #111;background:#e34b2f;color:#fff;font-weight:900;box-shadow:inset 0 3px 0 #ff9d86,0 5px 0 #8f1f10}
.radar-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #ff9d86,0 2px 0 #8f1f10}
@keyframes radarping{50%{transform:scale(1.24);filter:brightness(1.2)}}@keyframes ripple{from{transform:scale(.7);opacity:.9}to{transform:scale(1.7);opacity:0}}
/* lanes */
.lane .n{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-weight:900;letter-spacing:.02em}
/* train */
.prog{height:14px;border-radius:4px;background:#0a0d26;border:1px solid #2a3470;transform:skewX(-14deg)}
.prog i{background:linear-gradient(90deg,#2f6bff,#5fd4ff,#fff);box-shadow:0 0 14px #5fd4ff;border-radius:2px}
.gravity{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(214,31,31,.25),rgba(0,0,0,0));border:1px solid rgba(255,80,80,.4);font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase}
.gravity b{font-size:26px;color:#ff5a5a;text-shadow:0 0 12px rgba(255,60,60,.7)}
.ex{border-left:4px solid var(--gi)}
.ex.done{opacity:.55;border-left-color:#3ee07a}
.ex .nm{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-weight:900;font-size:17px;letter-spacing:.01em}
.ex .ds{color:#ffd400}
.set{border:2px solid #2f6bff;background:radial-gradient(circle,#0e1a55,#070b26);color:#9fb4ff;font-family:"Impact","Arial Black",sans-serif;font-style:italic}
.set.on{background:radial-gradient(circle at 40% 35%,#fff 0 18%,#9be8ff 35%,#2f6bff 80%);border-color:#c8f3ff;color:#06123a;box-shadow:0 0 16px #5fd4ff,0 0 30px rgba(95,212,255,.5)}
.tag{background:rgba(255,122,0,.15);color:#ffb366}
.badge{font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-weight:900}
.badge.ok{background:rgba(62,224,122,.18);color:#3ee07a}.badge.cur{background:rgba(255,212,0,.18);color:#ffd400}
/* skill path = dragon balls */
.pn:before{background:#2a3470;width:4px;left:21px}
.pn.passed:before{background:linear-gradient(#ffd400,#ff7a00);box-shadow:0 0 10px rgba(255,180,0,.6)}
.dot{background:radial-gradient(circle at 35% 30%,#ffffff40 0 10%,transparent 11%),radial-gradient(circle,#2a2f5a,#121638);border:2px solid #323b78;color:#7c86c0;font-family:"Impact","Arial Black",sans-serif;font-style:italic}
.pn.passed .dot{background:radial-gradient(circle at 35% 30%,#fff 0 9%,transparent 10%),radial-gradient(circle at 50% 55%,#ffcc33,#ff8a00 60%,#c95100);border-color:#000;color:#d61f1f;font-size:20px;box-shadow:0 0 14px rgba(255,170,0,.8)}
.pn.open .dot{border-color:#5fd4ff;color:#5fd4ff}
.pn.cur .dot{background:radial-gradient(circle at 40% 35%,#fff 0 15%,#9be8ff 35%,#2f6bff 85%);border:0;color:#06123a;box-shadow:0 0 0 5px rgba(95,212,255,.25),0 0 24px #5fd4ff;animation:pulse 1.6s ease-in-out infinite}
.pn.cur .pbody{border-color:#5fd4ff;box-shadow:0 0 18px rgba(95,212,255,.25)}
.pbody .t{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
/* sheet */
.sheet{background:linear-gradient(180deg,#10164a,#080b22);border-top:3px solid #ff7a00}
.sheet h2{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;color:#ffd400;text-shadow:0 2px 0 #7a1d00}
.sec h4{color:#5fd4ff;font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:13px}
.grab{background:#ff7a00}
/* video */
.igbtn{background:linear-gradient(180deg,#ff5f5f,#d61f1f);color:#fff}
.vid .play{background:linear-gradient(180deg,#ffb000,#ff6a00);font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.04em;font-size:16px;text-shadow:0 2px 0 #8a2400}
.vthumb{background:radial-gradient(circle at 35% 30%,#fff 0 9%,transparent 10%),radial-gradient(circle at 50% 55%,#ffcc33,#ff8a00 60%,#c95100);color:#d61f1f;border-radius:50%;font-size:20px}
/* nav = capsule */
nav{background:linear-gradient(180deg,rgba(18,24,64,.96),rgba(7,9,26,.98));border-top:2px solid #ff7a00;box-shadow:0 -6px 24px rgba(255,122,0,.18)}
nav button{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;font-size:11px}
nav button.on{color:#ffd400;text-shadow:0 0 10px rgba(255,212,0,.6)}nav button.on svg{color:#ff7a00;filter:drop-shadow(0 0 6px rgba(255,122,0,.8))}
/* timer = time chamber */
#timer{background:linear-gradient(135deg,#f4f1ff,#d9e4ff);color:#0b1240;border:3px solid #000;box-shadow:0 0 0 3px #ffd400,0 12px 30px rgba(0,0,0,.6)}
#timer .muted{color:#3a4790;font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase}
#tnum{font-family:"Impact","Arial Black",sans-serif;font-style:italic}
#timer .btn{background:#0b1240;color:#fff;border-color:#000}
/* toast = speech burst */
.toast{background:#fff8e7;color:#0b1240;border:3px solid #000;font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;box-shadow:5px 5px 0 #ff7a00;border-radius:6px}
.vid2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.iglink{margin-top:10px;font-size:13px;color:#9fb4ff;text-decoration:none;font-weight:700}
/* FX */
.fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.beam{position:fixed;left:-10%;top:50%;height:90px;width:0;transform:translateY(-50%);border-radius:0 60px 60px 0;background:linear-gradient(180deg,transparent,#5fd4ff 20%,#fff 45%,#fff 55%,#5fd4ff 80%,transparent);box-shadow:0 0 60px 20px rgba(95,212,255,.7);animation:beam 1.1s cubic-bezier(.2,.8,.2,1) forwards;z-index:61}
@keyframes beam{0%{width:0}60%{width:130%}100%{width:130%;opacity:0}}
.flash{position:fixed;inset:0;z-index:62;background:radial-gradient(circle,#fff,var(--fl,#ffd400) 40%,transparent 75%);animation:flash 1.2s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.6)}20%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.shout{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:63;font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:44px;line-height:1;color:#ffd400;-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #b23a00,0 0 30px rgba(255,200,0,.8);animation:shout 1.6s ease-out forwards;text-transform:uppercase}
.shout small{display:block;font-size:18px;color:#fff;-webkit-text-stroke:1px #000;margin-top:6px}
@keyframes shout{0%{transform:scale(3) rotate(-8deg);opacity:0}15%{transform:scale(1) rotate(-4deg);opacity:1}80%{opacity:1}100%{transform:scale(1.1) rotate(-4deg);opacity:0}}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px #5fd4ff;z-index:61;pointer-events:none;animation:spk .6s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.speed{position:fixed;inset:0;z-index:59;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0 3deg,rgba(255,255,255,.18) 3deg 4deg);animation:flash .9s ease-out forwards}
/* ===== v3.2 polish ===== */
nav button{font-size:12px!important}.wd b{font-size:12px}.blip span{font-size:12px!important}
.badge.ok{background:#0f3d24!important;color:#5dff9c!important}
#main{animation:tabIn .28s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid var(--hero-b,#ffd400);font-family:"Impact","Arial Black",sans-serif;font-style:italic;font-size:13px;color:var(--hero-b,#ffd400);white-space:nowrap}
.pchip i{width:8px;height:8px;border-radius:50%;background:var(--hero-b,#ffd400);box-shadow:0 0 8px var(--hero-b,#ffd400);animation:pulse 1.4s infinite}
.tap{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ex{position:relative}
.ex.next{border-color:#5fd4ff;box-shadow:0 0 0 1px #5fd4ff,0 0 22px rgba(95,212,255,.25)}
.ex.next:before{content:"NEXT UP";position:absolute;right:12px;top:-9px;background:#5fd4ff;color:#06123a;font:900 italic 12px Impact,Arial Black,sans-serif;padding:3px 8px;border-radius:6px;letter-spacing:.06em;z-index:2}
.chip .ck{color:#3ee07a;margin-left:4px}
.progwrap{position:relative;margin-top:22px}.progwrap .pc{position:absolute;right:4px;top:-20px;font:900 italic 13px Impact,Arial Black,sans-serif;color:#5fd4ff}
#timer.hot{box-shadow:0 0 0 3px #ff5a5a,0 0 40px rgba(255,90,90,.7);animation:shake .25s infinite}
@keyframes shake{50%{transform:translateX(2px)}}
.anaWrap{position:relative;border-radius:16px;overflow:hidden;background:#000;border:2px solid #2a3470;box-shadow:0 0 24px rgba(95,212,255,.15)}
.anaWrap video{display:block;width:100%;max-height:62vh;object-fit:contain;background:#000}
.anaWrap canvas{position:absolute;inset:0;width:100%;height:100%}
.toolhint{position:absolute;left:10px;top:10px;background:rgba(7,9,26,.85);color:#3ee07a;font:900 italic 13px Impact,Arial Black,sans-serif;padding:6px 10px;border-radius:8px;pointer-events:none}
.scrub{width:100%;accent-color:#ff7a00;margin:10px 0 2px;height:28px;background:none;border:0;padding:0}
.ctrls{display:flex;gap:8px}
select{width:100%;margin-top:4px;background:#1b2250;color:#fff8e7;border:1px solid #2a3470;border-radius:10px;padding:10px;font-size:14px;min-height:44px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{background:rgba(0,0,0,.3);border:1px solid #2a3470;border-radius:12px;padding:8px;text-align:center}
.mt b{display:block;font:900 italic 22px Impact,Arial Black,sans-serif;color:#5fd4ff}.mt span{font-size:12px;color:var(--mut)}
.fscore{display:flex;gap:12px;align-items:center;margin:12px 0 6px}
.fs-n{font:900 italic 46px Impact,Arial Black,sans-serif;min-width:70px;text-align:center}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2a3470;font-size:14px}.chk:last-child{border:0}
.chk i{width:12px;height:12px;border-radius:50%;flex:none}
.chk.ok i{background:#3ee07a;box-shadow:0 0 8px #3ee07a}.chk.mid i{background:#ffd400;box-shadow:0 0 8px #ffd400}.chk.bad i{background:#ff5a5a;box-shadow:0 0 8px #ff5a5a}.chk.na i{background:#323b78}
.chk span{font:900 italic 15px Impact,Arial Black,sans-serif;color:#fff8e7}
label.btn{cursor:pointer}
nav button{min-width:0;padding:6px 0}
/* ===== v3.3 detail pass ===== */
nav button{white-space:nowrap;font-size:12px!important;letter-spacing:.02em}
:focus-visible{outline:3px solid #2f6bff;outline-offset:2px}
header{padding-top:calc(14px + env(safe-area-inset-top))}
.card,.ex,.pbody,.vcard,.lane,.stat{transition:transform .15s ease,box-shadow .2s ease}
.vcard:active,.lane:active,.pbody:active{transform:scale(.985)}
.modal{transition:background .2s}
.thm{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;background:rgba(0,0,0,.35);border:1px solid #2a3470;margin-right:8px;cursor:pointer}
#hact{display:flex;align-items:center}
/* ===== LIGHT THEME (default) ===== */
html.light{--bg:#f7f3e8;--bg2:#ffffff;--card:#ffffff;--card2:#f1ece0;--line:#e4dccb;--tx:#16193a;--mut:#5b6286;--acc:#ff6a00;--acc2:#f5a300;--ok:#12a356;--ki:#1f6fff;--lock:#cfc7b4}
html.light,html.light body{background:#f7f3e8;color:#16193a}
html.light body{background:radial-gradient(1100px 520px at 85% -12%,rgba(95,180,255,.38),transparent 62%),radial-gradient(900px 480px at -10% 110%,rgba(255,150,40,.20),transparent 60%),linear-gradient(180deg,#eaf4ff 0,#f7f3e8 420px);background-attachment:fixed}
html.light body:before{opacity:.5;background-image:radial-gradient(60px 22px at 60px 60px,#fff,transparent),radial-gradient(90px 28px at 260px 140px,#ffffffcc,transparent),radial-gradient(70px 20px at 160px 230px,#ffffffaa,transparent);background-size:380px 300px;animation:stars 160s linear infinite}
html.light header{background:linear-gradient(180deg,rgba(234,244,255,.97) 70%,rgba(234,244,255,0))}
html.light h1{color:#ff7a00;-webkit-text-stroke:1.2px #16193a;text-shadow:0 3px 0 #16193a,0 0 0 transparent}
html.light .sub{color:#2f55c8}
html.light .card,html.light .stat,html.light .lane,html.light .ex,html.light .pbody,html.light .sec,html.light .vcard{background:#fff;border:1px solid #e4dccb;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 18px rgba(40,40,90,.08)}
html.light .ex{border-left:4px solid #ff7a00}html.light .ex.done{border-left-color:#12a356}
html.light .ex .ds{color:#a84300}
html.light .ex.next{border-color:#1f6fff;box-shadow:0 0 0 1px #1f6fff,0 8px 22px rgba(31,111,255,.18)}
html.light .ex.next:before{background:#1f6fff;color:#fff}
html.light .lbl{color:#16193a;text-shadow:none}
html.light .lbl:after{background:linear-gradient(90deg,#ff7a00,transparent)}
html.light .chip{background:#fff;border-color:#e4dccb;color:#5b6286}
html.light .chip.on{color:#fff;border-color:#ff9a00;box-shadow:0 4px 14px rgba(255,120,0,.3)}
html.light .btn{background:#fff;color:#16193a;border:1px solid #e4dccb;box-shadow:0 3px 0 #e4dccb}
html.light .btn.p{background:linear-gradient(180deg,#ffb000,#ff6a00 55%,#d63a00);color:#fff;border:0;box-shadow:0 0 0 2px #ffd400 inset,0 5px 0 #a33000,0 10px 20px rgba(255,120,0,.3)}
html.light .btn.g{background:linear-gradient(180deg,#5fc8ff,#1f6fff 60%,#1d3fb8);color:#fff;border:0;box-shadow:0 0 0 2px #a8ecff inset,0 5px 0 #0b2f8a,0 10px 22px rgba(31,111,255,.3)}
html.light .muted{color:#5b6286}
html.light .tag{background:rgba(255,122,0,.12);color:#b45200}
html.light .badge{background:#f1ece0;color:#5b6286}
html.light .badge.ok{background:#dff6e8!important;color:#0c7a3e!important}html.light .badge.cur{background:#fff1cc;color:#a35f00}html.light .badge.v{background:#ffe3e3;color:#b31d1d}
html.light .set{background:#fff;border-color:#9db8ff;color:#2f55c8}
html.light .set.on{color:#06123a;box-shadow:0 0 12px rgba(31,111,255,.45)}
html.light .prog{background:#ece6d6;border-color:#e4dccb}
html.light .prog i{background:linear-gradient(90deg,#1f6fff,#5fc8ff);box-shadow:0 0 8px rgba(31,111,255,.5)}
html.light .progwrap .pc{color:#1f6fff}
html.light .gravity{background:linear-gradient(90deg,rgba(214,31,31,.10),rgba(255,255,255,0));border-color:rgba(214,31,31,.3);color:#16193a}
html.light .gravity b{color:#d61f1f;text-shadow:none}
html.light .pn:before{background:#e4dccb}
html.light .dot{background:radial-gradient(circle at 35% 30%,#fff 0 10%,transparent 11%),radial-gradient(circle,#fff,#eee7d7);border-color:#cfc7b4;color:#8a8fa8}
html.light .pn.open .dot{border-color:#1f6fff;color:#1f6fff}
html.light .pn.cur .pbody{border-color:#1f6fff;box-shadow:0 8px 20px rgba(31,111,255,.15)}
html.light .sheet{background:linear-gradient(180deg,#ffffff,#f7f3e8);border-top:3px solid #ff7a00;color:#16193a}
html.light .sheet h2{color:#ff7a00;-webkit-text-stroke:.8px #16193a;text-shadow:0 2px 0 #16193a}
html.light .sec{background:#fff}
html.light .sec h4{color:#1f6fff}
html.light .modal{background:rgba(22,25,58,.45)}
html.light nav{background:rgba(255,255,255,.97);border-top:2px solid #ff7a00;box-shadow:0 -6px 20px rgba(40,40,90,.08)}
html.light nav button{color:#6b7194}
html.light nav button.on{color:#ff6a00;text-shadow:none}html.light nav button.on svg{color:#ff6a00;filter:none}
html.light input,html.light textarea,html.light select{background:#fff;color:#16193a;border-color:#d8cfbb}
html.light .toast{background:#fff;color:#16193a}
html.light .wd{color:#5b6286}html.light .wd b{color:#5b6286}html.light .wd.done b{color:#a84300}
html.light .wd.rest .orb{opacity:.35}
html.light .hero{background:radial-gradient(90% 120% at 50% 120%,var(--hero-a,rgba(255,212,0,.6)),transparent 60%),linear-gradient(180deg,#3d8bff,#1d3fb8);border-color:var(--hero-b,#ffd400);box-shadow:0 0 0 2px #16193a inset,0 10px 30px rgba(31,80,200,.3)}
html.light .pchip,html.light .thm{background:#fff;border-color:#e4dccb;color:#16193a}
html.light .pchip{color:#a84300;border-color:#ffb24d}
html.light .mt{background:#f7f3e8;border-color:#e4dccb}html.light .mt b{color:#1f6fff}
html.light .chk{border-color:#ece6d6}html.light .chk span{color:#16193a}
html.light .anaWrap{border-color:#e4dccb;box-shadow:0 8px 22px rgba(40,40,90,.12)}
html.light .hist{border-color:#ece6d6}
html.light .bars div.z{background:#ece6d6}
html.light .lane .c{color:#5b6286}
html.light .shenron{color:#0c7a3e;text-shadow:none}
/* inline accent colors tuned for light backgrounds */
html.light [style*="color:#ffd400"]{color:#a84300!important;text-shadow:none!important}
html.light [style*="color:#5fd4ff"]{color:#1f6fff!important}
html.light [style*="color:#3ee07a"]{color:#0c7a3e!important}

/* ===== v3.5 DEPTH PASS ===== */
:root{--e1:0 1px 2px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.22);--e2:0 2px 4px rgba(0,0,0,.28),0 8px 20px rgba(0,0,0,.32),0 18px 40px rgba(0,0,12,.22);--e3:0 4px 10px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.42),0 30px 70px rgba(0,0,24,.32);--hl:inset 0 1px 0 rgba(255,255,255,.07);--glass:rgba(9,12,36,.66);--ease:cubic-bezier(.2,.8,.2,1)}
html.light{--e1:0 1px 2px rgba(30,30,80,.07),0 2px 6px rgba(30,30,80,.05);--e2:0 1px 2px rgba(30,30,80,.06),0 6px 16px rgba(30,40,100,.08),0 16px 34px rgba(30,40,100,.07);--e3:0 2px 6px rgba(30,30,80,.08),0 14px 30px rgba(30,40,100,.12),0 30px 60px rgba(30,40,100,.12);--hl:inset 0 1px 0 #fff;--glass:rgba(244,248,255,.78)}
body{line-height:1.45}
main{max-width:820px;margin:0 auto;padding:8px 16px 24px}
.htop{max-width:788px;margin:0 auto}
/* glass header with flowing ki line */
header{background:var(--glass)!important;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 10px 30px rgba(0,0,0,.22);padding-bottom:14px}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#ff7a00,#ffd400,#5fd4ff,#ff7a00,transparent);background-size:200% 100%;animation:kiflow 6s linear infinite;opacity:.85}
@keyframes kiflow{to{background-position:-200% 0}}
html.light header{box-shadow:0 8px 24px rgba(30,40,100,.08)}
h1{font-size:30px;line-height:1.05}
html.light h1{color:#c25400;-webkit-text-stroke:1px #16193a;text-shadow:0 3px 0 #16193a}
/* glass nav, pill for active tab */
nav{background:var(--glass)!important;-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-top:1px solid rgba(255,140,0,.55)!important;box-shadow:0 -10px 30px rgba(0,0,0,.3)!important;justify-content:center}
nav button{position:relative;isolation:isolate;max-width:150px;transition:color .2s,transform .15s var(--ease)}
nav button:active{transform:scale(.92)}
nav button:before{content:"";position:absolute;inset:3px 8%;border-radius:16px;z-index:-1;opacity:0;transform:scale(.7);transition:opacity .25s var(--ease),transform .25s var(--ease);background:linear-gradient(180deg,rgba(255,122,0,.22),rgba(255,212,0,.06));box-shadow:inset 0 0 0 1px rgba(255,170,0,.4),0 4px 14px rgba(255,120,0,.25)}
nav button.on:before{opacity:1;transform:none}
html.light nav{box-shadow:0 -8px 24px rgba(30,40,100,.08)!important}
html.light nav button.on{color:#a84300!important}html.light nav button.on svg{color:#a84300!important}
html.light nav button:before{background:linear-gradient(180deg,#fff1e0,#fff8ef);box-shadow:inset 0 0 0 1px #ffc78a,0 4px 12px rgba(200,90,0,.15)}
/* cards: layered depth */
.card,.stat,.lane,.ex,.pbody,.sec,.vcard{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),linear-gradient(165deg,#1a2152 0%,#121842 48%,#0d1233 100%);box-shadow:var(--hl),var(--e2)}
html.light .card,html.light .stat,html.light .lane,html.light .ex,html.light .pbody,html.light .sec,html.light .vcard{background:linear-gradient(180deg,#fff,#fffdf8);box-shadow:var(--hl),var(--e2);border-color:#ebe3d2}
.ex{padding:16px;margin-bottom:12px;transition:transform .18s var(--ease),box-shadow .25s,opacity .25s}
.ex:active{transform:translateY(1px) scale(.995)}
.ex .nm{font-size:17px;line-height:1.2}
.ex .ds{font-size:13.5px;margin-top:4px}
.ex .nt{line-height:1.45}
.ex.done{opacity:.62}
.ex.next{animation:kiPulse 2.6s ease-in-out infinite}
@keyframes kiPulse{0%,100%{box-shadow:0 0 0 1.5px #5fd4ff,0 0 20px rgba(95,212,255,.25),var(--e2)}50%{box-shadow:0 0 0 1.5px #5fd4ff,0 0 36px rgba(95,212,255,.5),var(--e2)}}
html.light .ex.next{animation:kiPulseL 2.6s ease-in-out infinite}
@keyframes kiPulseL{0%,100%{box-shadow:0 0 0 1.5px #1f6fff,0 8px 20px rgba(31,111,255,.14),var(--e2)}50%{box-shadow:0 0 0 1.5px #1f6fff,0 10px 30px rgba(31,111,255,.3),var(--e2)}}
.ex.next:before{box-shadow:0 4px 10px rgba(0,0,0,.25)}
.stat{padding:14px 12px}
.stat b{font:900 italic 30px Impact,"Arial Black",sans-serif;background:linear-gradient(180deg,#fff6c2,#ffb000 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}
html.light .stat b{background:linear-gradient(180deg,#c25400,#7a2a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.lane{border-radius:18px;padding:12px}
.lane:active,.vcard:active{transform:scale(.97)}
/* section dividers */
.grp{display:flex;align-items:center;gap:10px;margin:24px 0 12px;padding:6px 6px 6px 6px;border-radius:16px;background:linear-gradient(90deg,rgba(255,122,0,.18),rgba(255,122,0,0) 75%);position:relative}
.grp:after{content:"";position:absolute;left:52px;right:0;bottom:-5px;height:2px;border-radius:2px;background:linear-gradient(90deg,#ff7a00,#ffd400 35%,transparent)}
.grp .gi{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45) 0 12%,transparent 13%),linear-gradient(160deg,#ffa41f,#d63a00);box-shadow:0 4px 12px rgba(255,110,0,.45),inset 0 -2px 0 rgba(0,0,0,.25)}
.grp .gt{flex:1;min-width:0;font:900 italic 17px Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#ffd400;text-shadow:0 2px 0 #7a1d00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gc{flex:none;font-size:12px;font-weight:800;color:#c9d1f5;background:rgba(0,0,0,.35);padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.grp.gdone .gi{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45) 0 12%,transparent 13%),linear-gradient(160deg,#5dff9c,#12a356);box-shadow:0 4px 12px rgba(18,163,86,.45),inset 0 -2px 0 rgba(0,0,0,.2)}
.grp.gdone .gc{color:#5dff9c}
html.light .grp{background:linear-gradient(90deg,rgba(255,122,0,.13),rgba(255,122,0,0) 75%)}
html.light .grp .gt{color:#16193a;text-shadow:none}
html.light .grp .gc{background:#fff;border-color:#e4dccb;color:#4a5175;box-shadow:var(--e1)}
html.light .grp.gdone .gc{color:#0c6b37}
/* tag chips */
.tag{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid rgba(255,160,60,.35);background:linear-gradient(180deg,rgba(255,122,0,.22),rgba(255,122,0,.08));color:#ffc285;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tband{border-color:rgba(95,160,255,.45);background:linear-gradient(180deg,rgba(47,107,255,.3),rgba(47,107,255,.1));color:#c4d4ff}
.troll{border-color:rgba(62,224,122,.4);background:linear-gradient(180deg,rgba(18,163,86,.28),rgba(18,163,86,.08));color:#a6ffc9}
html.light .tag{background:#fff4e8;border-color:#ffcf9e;color:#8f3e00;box-shadow:none}
html.light .tband{background:#eaf1ff;border-color:#b9cdff;color:#1d3fb8}
html.light .troll{background:#e6f8ee;border-color:#a9e6c2;color:#0c6b37}
/* chips */
.chip{box-shadow:var(--e1);transition:transform .15s var(--ease),box-shadow .2s}
.chip:active{transform:scale(.95)}
.chip.on{box-shadow:0 0 0 1px #ffd400 inset,0 6px 16px rgba(255,120,0,.4)}
html.light .chip.on{background:linear-gradient(180deg,#c25400,#9a3d00)!important;border-color:#9a3d00!important;color:#fff!important;text-shadow:none;box-shadow:0 6px 14px rgba(170,70,0,.28)}
html.light .chip.on .ck{color:#bfffd6}
/* buttons */
.btn{transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
html.light .btn.p{background:linear-gradient(180deg,#c85a00,#a84300 55%,#8a3200);box-shadow:0 0 0 2px #ffb000 inset,0 5px 0 #6a2400,0 10px 20px rgba(170,70,0,.28)}
html.light .btn.g{background:linear-gradient(180deg,#2f7bff,#1d55d6 55%,#16389e);box-shadow:0 0 0 2px #9cc4ff inset,0 5px 0 #0b2370,0 10px 22px rgba(31,90,220,.28)}
html.light .badge.cur{color:#7a4500}
/* sets + burst */
.set{position:relative;width:46px;height:46px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.25);transition:transform .18s var(--ease),box-shadow .2s}
.set:active{transform:scale(.88)}
html.light .set{box-shadow:inset 0 1px 3px rgba(30,40,100,.12),0 2px 0 #e4dccb}
.set.burst{animation:setPop .55s var(--ease)}
.set.burst:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid #5fd4ff;animation:ringOut .65s ease-out forwards;pointer-events:none}
@keyframes setPop{0%{transform:scale(.6)}55%{transform:scale(1.2)}100%{transform:scale(1.05)}}
@keyframes ringOut{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(2)}}
/* progress rings */
.ring .rt{stroke:rgba(255,255,255,.1)}
.ring .rp{stroke:#ff7a00;filter:drop-shadow(0 0 4px rgba(255,122,0,.55));animation:ringDraw 1.1s var(--ease) both}
.ring.full .rp{stroke:#3ee07a;filter:drop-shadow(0 0 4px rgba(62,224,122,.6))}
.ring .rx{fill:#fff8e7}
html.light .ring .rt{stroke:#ece6d6}html.light .ring .rp{stroke:#e06400;filter:none}html.light .ring.full .rp{stroke:#12a356}html.light .ring .rx{fill:#16193a}
@keyframes ringDraw{from{stroke-dashoffset:var(--c)}}
.prog i{transition:width .5s var(--ease);position:relative;overflow:hidden}
.prog i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sheen 2.4s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
/* hero + power gauge (solid dark base under every gradient) */
.hero{border-radius:26px;padding:22px;background-color:#0b1038;box-shadow:0 0 0 2px #000 inset,0 0 40px var(--hero-g,rgba(255,200,0,.35)),var(--e3)}
html.light .hero{background:radial-gradient(90% 120% at 50% 125%,var(--hero-a,rgba(255,212,0,.5)),transparent 58%),linear-gradient(180deg,#1b3a9e,#0f1f66);background-color:#0f1f66;box-shadow:0 0 0 2px #16193a inset,var(--e3)}
.hero .k,.hero .t,.hero .d{padding-right:96px}
.hero .d{color:#e6ecff}
.hero .btn.ghost{background:rgba(7,10,40,.6)!important;color:#fff!important;border:1px solid rgba(255,255,255,.5)!important;box-shadow:none!important}
.gauge{position:absolute;right:10px;top:12px;width:84px;height:84px;z-index:2}
.gauge:before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px dashed rgba(255,230,120,.45);animation:spin 16s linear infinite}
.gauge svg{position:absolute;inset:0;filter:drop-shadow(0 0 8px var(--hero-g,rgba(255,200,0,.7)))}
.gauge .gt0{fill:none;stroke:rgba(0,0,0,.5);stroke-width:7}
.gauge .gt1{fill:none;stroke-width:7;stroke-linecap:round;animation:ringDraw 1.4s var(--ease) both}
.gauge .emblem{position:absolute;right:auto;left:13px;top:13px;width:58px;height:58px}
.gauge .gpct{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font:900 italic 12px Impact,"Arial Black",sans-serif;color:#fff;background:#07091a;border:1px solid var(--hero-b,#ffd400);padding:1px 8px;border-radius:7px;white-space:nowrap;z-index:3}
.scouter{border-radius:20px;background-color:#04160c;box-shadow:inset 0 0 30px rgba(0,255,120,.12),var(--e2)}
html.light .scouter{background-color:#06200f}
.radar{background-color:#06200f;box-shadow:0 0 0 3px #6b7280,inset 0 0 30px rgba(0,0,0,.6),var(--e2)}
/* skill tree nodes glow by state */
.dot{position:relative;transition:box-shadow .3s}
.pn.locked .dot{filter:grayscale(.8);opacity:.7}
.pn.open:not(.cur):not(.passed) .dot{box-shadow:0 0 0 3px rgba(95,212,255,.14),0 0 14px rgba(95,212,255,.35)}
.pn.passed .dot{box-shadow:0 0 0 3px rgba(255,212,0,.22),0 0 18px rgba(255,170,0,.85)}
.pn.passed .pbody{border-color:rgba(255,212,0,.4);background:linear-gradient(180deg,rgba(255,212,0,.07),transparent 50%),linear-gradient(165deg,#1a2152,#0d1233)}
.pn.cur .dot{animation:kiGlow 1.8s ease-in-out infinite}
@keyframes kiGlow{0%,100%{box-shadow:0 0 0 5px rgba(95,212,255,.22),0 0 18px #5fd4ff;transform:scale(1)}50%{box-shadow:0 0 0 9px rgba(95,212,255,.12),0 0 34px #5fd4ff;transform:scale(1.06)}}
html.light .pn.open:not(.cur):not(.passed) .dot{box-shadow:0 0 0 3px rgba(31,111,255,.12),0 4px 12px rgba(31,111,255,.2)}
html.light .pn.passed .pbody{border-color:#f0c96a;background:linear-gradient(180deg,#fffaea,#fff)}
html.light .pn.passed .dot{box-shadow:0 0 0 3px rgba(255,170,0,.2),0 4px 14px rgba(255,140,0,.45)}
html.light .pn.cur .dot{animation:kiGlowL 1.8s ease-in-out infinite}
@keyframes kiGlowL{0%,100%{box-shadow:0 0 0 5px rgba(31,111,255,.18),0 6px 16px rgba(31,111,255,.35)}50%{box-shadow:0 0 0 9px rgba(31,111,255,.08),0 8px 26px rgba(31,111,255,.5)}}
.pbody{transition:transform .15s var(--ease)}
/* sheet + timer depth */
.sheet{border-radius:28px 28px 0 0;box-shadow:var(--e3)}
.modal{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#timer{border-radius:24px}
.vthumb{box-shadow:0 4px 12px rgba(255,120,0,.4),inset 0 -3px 0 rgba(0,0,0,.2)}
/* empty states */
.empty{text-align:center;padding:16px 10px 12px}
.empty .eo{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.7) 0 10%,transparent 11%),radial-gradient(circle at 50% 55%,#ffcc33,#ff8a00 60%,#c95100);box-shadow:0 0 0 6px rgba(255,170,0,.12),0 0 24px rgba(255,170,0,.45);animation:floaty 3s ease-in-out infinite}
.empty .et{font:900 italic 16px Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#ffd400}
.empty .em{font-size:13px;color:var(--mut);margin:4px auto 0;line-height:1.45;max-width:300px}
html.light .empty .et{color:#16193a}
@keyframes floaty{50%{transform:translateY(-4px)}}
.hero .row .btn{flex:1;white-space:nowrap;font-size:14px;padding:10px 10px}
html.light .btn.igbtn{background:linear-gradient(180deg,#e0352f,#b81414);color:#fff;border:0;box-shadow:0 4px 0 #7a0c0c,0 8px 16px rgba(180,20,20,.22)}
header{position:sticky!important;top:0;z-index:7!important}
@media (max-width:420px){h1{font-size:26px}}
@media (min-width:760px){.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== v3.6 EMBEDS + FORM ===== */
.emb{margin-top:12px;border-radius:16px;overflow:hidden;position:relative}
.embp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;min-height:92px;padding:14px 16px;border-radius:16px;position:relative;overflow:hidden;
 background:radial-gradient(140px 90px at 18% 50%,rgba(255,122,0,.55),transparent 70%),radial-gradient(220px 120px at 100% 0,rgba(47,107,255,.45),transparent 70%),linear-gradient(135deg,#0d1130,#1b2250 60%,#2a1450);
 box-shadow:inset 0 0 0 1px rgba(255,212,0,.25),0 6px 18px rgba(7,9,26,.35)}
.embp:focus-visible{outline:3px solid #ffd400;outline-offset:2px}

.embglow{position:absolute;left:12px;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,0,.55),transparent 70%);animation:embpulse 2.4s ease-in-out infinite}

.embplay{position:relative;flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffd400,#ff7a00 55%,#d63a00);box-shadow:0 0 0 3px #fff8e7,0 6px 16px rgba(255,106,0,.55)}
.embplay svg{width:26px;height:26px;fill:#fff;margin-left:3px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.embmeta{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.embh{font-weight:900;font-size:13px;color:#ffb000;letter-spacing:.02em;overflow-wrap:anywhere}
.embt{font-family:"Impact","Arial Black",sans-serif;font-style:italic;text-transform:uppercase;font-size:15px;line-height:1.2;color:#fff8e7;overflow-wrap:anywhere}
.embs{font-size:12px;color:#c9d0f5;font-weight:700}
.emb.live{background:#0d1130;box-shadow:inset 0 0 0 2px #ffd400}
.embf{position:relative;height:560px;background:#0d1130}
.embf:before{content:"Summoning tutorial…";position:absolute;inset:0;display:grid;place-items:center;color:#ffd400;font:900 italic 15px "Impact","Arial Black",sans-serif;letter-spacing:.04em}
.embf iframe{position:relative;width:100%;height:100%;border:0;display:block;background:transparent}
.embbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0d1130}
.embbar .muted{color:#c9d0f5;flex:1;min-width:0;overflow-wrap:anywhere}
.embbar .btn{background:#1b2250;color:#fff8e7;border:1px solid #2f3a7a;box-shadow:none}
.embo{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card2);border:1px dashed var(--line)}
.embo .eoi{font-size:24px}.embo b{font-size:14px}.embo>div:nth-child(2){flex:1;min-width:0}
.embmore{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.fbtn:focus-visible{outline:3px solid var(--ki);outline-offset:2px}
.fbtn .fi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffd400,#ff7a00);color:#16193a;font-size:11px;flex:none}

@keyframes fpin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fh{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:2px 0 8px}
.cues{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.cues li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35;font-weight:600}
.cues li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;color:#fff;background:linear-gradient(135deg,#2f6bff,#1d3fb8);box-shadow:0 0 0 2px rgba(95,212,255,.35)}
.mwrap{display:flex;gap:12px;align-items:flex-start}
.mchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}

.home-scanner:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 44%,transparent 0 38%,rgba(2,8,20,.12) 70%,rgba(2,8,20,.32) 100%)
}
.home-scanner>.finder-title-wrap,.home-scanner>.dragon-radar-shell,.home-scanner>.master-detail{position:relative;z-index:1}
.finder-title-wrap{margin:0 0 8px!important;padding:7px 8px;border-radius:14px;background:rgba(4,10,25,.62);backdrop-filter:blur(5px)}
.finder-title{font-size:clamp(21px,6vw,29px)!important;line-height:1!important}
.finder-sub{font-size:8.5px!important;line-height:1.3!important;color:#eef5ff!important;letter-spacing:.04em!important;text-shadow:0 1px 2px #000}
.finder-legend{display:none!important}

.dragon-radar-shell{
  max-width:274px!important;margin:0 auto!important;padding:8px 8px 10px!important;
  border-radius:23px!important;border-width:2px!important;
  background:rgba(233,190,39,.93)!important;
  box-shadow:inset 0 -6px 0 rgba(164,119,8,.78),0 8px 20px rgba(0,0,0,.36)!important;
}
.dragon-radar-shell:before,.dragon-radar-shell:after{display:none!important}
.radar-top{font-size:8px!important;margin:0 3px 6px!important;letter-spacing:.04em!important}
.dragon-radar-shell .radar{
  width:218px!important;max-width:72vw!important;margin:0 auto!important;
  border-width:5px!important;box-shadow:0 0 0 2px #101613,inset 0 0 0 1px #6e806d,inset 0 0 26px rgba(0,0,0,.72)!important;
}
.radar .rings{inset:13%!important}
.radar-signal{
  position:absolute;z-index:7;width:78px;transform:translate(-50%,-50%);
  border:0;background:transparent!important;padding:0!important;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  overflow:visible!important;color:#fff;box-shadow:none!important
}
.radar-signal:active{transform:translate(-50%,-50%) scale(.95)!important}
.dball{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 32% 25%,rgba(255,255,255,.98) 0 8%,rgba(255,246,164,.85) 9% 17%,transparent 18%),
    radial-gradient(circle at 50% 50%,#ffd04a 0 24%,#ff9b00 57%,#e85200 100%);
  border:1px solid #7d2c00;
  box-shadow:inset -3px -4px 5px rgba(150,42,0,.28),0 0 7px #ffd34e,0 0 12px rgba(255,117,0,.62)
}
.radar-signal.done .dball{box-shadow:inset -3px -4px 5px rgba(150,42,0,.25),0 0 8px #fff5a7,0 0 18px #ffb000}
.radar-signal.sel .dball{outline:2px solid #fff6a8;outline-offset:2px;animation:selectedAura 1.6s ease-in-out infinite}
.db-stars{
  width:14px;max-height:14px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  color:#c91f18;font-size:4.8px;line-height:4.3px;letter-spacing:-.7px;text-shadow:0 .4px 0 #fff2;
  overflow:hidden
}
.radar-full-label{
  display:block;width:78px;min-height:16px;padding:3px 4px;
  border-radius:6px;background:rgba(2,11,18,.90);border:1px solid rgba(137,255,174,.42);
  color:#fff;font:900 8.5px/1.05 system-ui,-apple-system,Roboto,sans-serif;
  text-align:center;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;
  overflow-wrap:normal!important;word-break:normal!important;text-shadow:0 1px 2px #000;
  box-sizing:border-box
}
.radar-signal.sel .radar-full-label{background:#17351e;border-color:#ffd400;color:#fff5ab}
.radar-controls{grid-template-columns:minmax(0,1fr) 39px!important;gap:7px!important;margin:7px 2px 0!important}
.radar-readout{font-size:9px!important;padding:6px 7px!important;line-height:1.25!important}
.radar-btn{width:39px!important;height:39px!important;font-size:9px!important;border-width:2px!important}
.master-detail.home-master-detail{max-width:340px;margin:9px auto 0!important;padding:10px!important;background:rgba(24,25,20,.92)!important;backdrop-filter:blur(6px)}
.home-master-detail .master-name{font-size:17px!important}
.home-master-detail .master-meta{font-size:10.5px!important}
.home-master-detail .master-ladder{margin-top:7px}
.master-more{margin-top:8px;border:1px solid #3f493d;border-radius:10px;background:#151a15;overflow:hidden}
.master-more summary{cursor:pointer;padding:8px 10px;font-size:11px;font-weight:900;color:#dfffe7;list-style:none}
.master-more summary::-webkit-details-marker{display:none}
.master-more summary:after{content:"▼";float:right;color:#ffd400}
.master-more[open] summary:after{content:"▲"}
.master-more .master-ladder{padding:0 8px 8px}
.home-master-detail .dbz-tidbit{display:none!important}

/* detailed anatomy atlas */
.anatomy-layout{display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr);gap:14px;align-items:start}
.bmap.anatomy-map{width:100%!important;max-width:240px;margin:0 auto}
.bmap.anatomy-map svg{width:100%!important;height:auto!important;display:block}
.bmap.anatomy-map .bs{fill:#171e43;stroke:#6f7ab6;stroke-width:.8}
.bmap.anatomy-map .rg{fill:#26306a;stroke:#11162f;stroke-width:.35}
.bmap.anatomy-map .rg.s{fill:#ffb66d;opacity:.9}
.bmap.anatomy-map .rg.p{fill:#ff5a16;stroke:#ffd17d;stroke-width:.55;filter:drop-shadow(0 0 2px rgba(255,98,24,.45))}
.bmap.anatomy-map text{font-size:7px!important;fill:#cbd5ff!important;letter-spacing:.06em!important}
.anatomy-lists{display:grid;gap:9px;min-width:0}
.anatomy-group{border:1px solid var(--line);border-radius:12px;padding:9px;background:rgba(0,0,0,.16)}
.anatomy-group.primary{border-color:rgba(255,100,24,.5)}
.anatomy-group.secondary{border-color:rgba(255,182,109,.38)}
.anatomy-group h4{margin:0 0 7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.anatomy-group.primary h4{color:#ff8a43}.anatomy-group.secondary h4{color:#ffc58e}
.anatomy-muscle{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.anatomy-muscle:first-of-type{border-top:0}
.anatomy-muscle b{font-size:12px;line-height:1.15;overflow-wrap:anywhere}
.anatomy-muscle span{font-size:9.5px;line-height:1.2;color:var(--mut);text-align:right;max-width:78px}
.anatomy-note{margin-top:8px;padding:8px 9px;border-radius:10px;background:rgba(95,212,255,.08);border:1px solid rgba(95,212,255,.2);font-size:10px;line-height:1.35;color:var(--mut)}
.anatomy-note b{color:#8be7ff}
html.light .home-scanner{border-color:#e1af3e}
html.light .home-master-detail{background:rgba(255,249,231,.94)!important}
html.light .anatomy-group{background:#fff}
@media(max-width:520px){
  .anatomy-layout{grid-template-columns:1fr}
  .bmap.anatomy-map{max-width:265px}
  .anatomy-lists{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){
  .dragon-radar-shell{max-width:252px!important}
  .dragon-radar-shell .radar{width:202px!important;max-width:68vw!important}
  .radar-signal{width:72px}
  .radar-full-label{width:72px;font-size:7.9px}
  .anatomy-lists{grid-template-columns:1fr}
}


/* ===== Supa Strength v3.11 · expandable mastery levels ===== */
.master-family{font:900 italic 25px/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;color:#fff4a8;margin:2px 0 2px}

let SS_AUDIO=null,SS_AUDIO_UNLOCKED=false;
function ssAudio(){
  if(SS_AUDIO)return SS_AUDIO;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    const ctx=new C(),master=ctx.createGain(),music=ctx.createGain(),sfx=ctx.createGain();
    master.gain.value=.82;music.gain.value=.14;sfx.gain.value=.18;
    music.connect(master);sfx.connect(master);master.connect(ctx.destination);
    SS_AUDIO={ctx,master,music,sfx,started:false,step:0,loop:null};
    return SS_AUDIO;
  }catch(e){return null}
}
function ssTone(freq,dur=.08,type='sine',gain=.12,when=0,bus='sfx'){
  const a=ssAudio();if(!a||a.ctx.state!=='running')return false;
  const t=a.ctx.currentTime+when,o=a.ctx.createOscillator(),g=a.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a[bus]);o.start(t);o.stop(t+dur+.03);return true
}
function ssMusicPulse(){
  const a=SS_AUDIO;if(!a||a.ctx.state!=='running'||S.musicOn===false)return;
  const bass=[110,110,146.83,164.81,98,123.47,146.83,82.41];
  const lead=[220,246.94,293.66,329.63,293.66,246.94,220,196];
  const i=(a.step||0)%bass.length;a.step=i+1;
  ssTone(bass[i],.50,'triangle',.20,0,'music');
  ssTone(lead[i],.20,'sine',.07,.045,'music');
  if(i%2===0)ssTone(bass[i]*2,.10,'square',.025,.16,'music')
}
function ssStartMusic(){
  const a=ssAudio();if(!a||a.started||a.ctx.state!=='running'||S.musicOn===false)return false;
  a.started=true;ssMusicPulse();a.loop=setInterval(ssMusicPulse,680);return true
}
async function ssResume(){
  const a=ssAudio();if(!a)return false;
  try{if(a.ctx.state!=='running')await a.ctx.resume()}catch(e){}
  if(a.ctx.state!=='running')return false;
  SS_AUDIO_UNLOCKED=true;
  if(S.musicOn!==false)ssStartMusic();
  return true
}
function ssStopMusic(){
  const a=SS_AUDIO;if(!a)return;
  if(a.loop){clearInterval(a.loop);a.loop=null}
  a.started=false
}
function ssPressTone(){ssTone(440,.055,'square',.11);ssTone(660,.045,'sine',.06,.018)}
function ssPress(){
  ssResume().then(ok=>{if(ok)ssPressTone()});
  try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}
}
function ssPowerPress(){
  ssResume().then(ok=>{if(ok){ssTone(220,.07,'sawtooth',.10);ssTone(440,.09,'triangle',.09,.025);ssTone(880,.08,'sine',.07,.055)}});
  try{if(navigator.vibrate)navigator.vibrate([10,18,10])}catch(e){}
}
S.musicOn=S.musicOn!==false;
const ssUnlockFromGesture=e=>{
  const b=e&&e.target&&e.target.closest&&e.target.closest('button,.btn,.chip,.lane,.finder-chip,.radar-signal,[role="button"]');
  ssResume().then(ok=>{if(ok&&b)ssPressTone()})

  if(custom)h+=`<div class="mission-lock"><div class="ret-mini"></div><div class="sp"><small>Scouter target locked</small><b>${esc(g.label)}</b><small>${day.items.length} focused movements · unrelated skills blocked</small></div></div>`;

  day.items.forEach((e,i)=>{
    const n=nSets(e.dose),done=sess[i]||0,l=laneFor(e.name);let extra='';
    if(l){const c=curNode(l);const t=holdTarget(c.id);extra='<div class="nt">Your form: <b style="color:var(--tx)">'+esc(c.name)+'</b>'+(t?' · '+t+'s holds (65% of '+S.best[c.id]+'s)':' · log a best hold in Skills')+'</div>'}
    if(e.group&&(i===0||day.items[i-1].group!==e.group)){const gi=day.items.map((x,j)=>[x,j]).filter(([x])=>x.group===e.group);const gt=gi.reduce((a,[x])=>a+nSets(x.dose),0),gd=gi.reduce((a,[x,j])=>a+Math.min(sess[j]||0,nSets(x.dose)),0);h+='<div class="grp '+(gd>=gt?'gdone':'')+'"><span class="gi">'+grpIcon(e.group)+'</span><span class="gt">'+esc(e.group)+'</span><span class="gc">'+gi.length+' drills · '+gd+'/'+gt+'</span></div>'}
    const setsHtml='<div class="sets">'+Array.from({length:n},(_,k)=>'<div class="set '+(k<done?'on':'')+(window._burst===day.id+'-'+i+'-'+k?' burst':'')+'" onclick="tapSet(\''+day.id+'\','+i+','+k+','+(/2 min/.test(e.rest||'')?120:90)+')">'+(k<done?'✓':k+1)+'</div>').join('')+'</div>';
    h+=luxExerciseCard(e,'t'+day.id+i,{id:'ex'+i,done:done>=n,next:i===nextI,extra:extra,sets:setsHtml});
  });  if(!day.items.length)h+=`<div class="card">${emptyState('📡','No matching drills','This focus stays strict instead of filling the workout with unrelated movements.')}</div>`;
  h+=`<button class="btn g" style="width:100%;margin:8px 0 10px;min-height:52px;font-size:16px" onclick="finish('${day.id}')" ${day.items.length?'':'disabled'}>${custom?'Kamehameha! Complete mission':'Kamehameha! Finish workout'}</button>`;
  h+='<div class="muted" style="text-align:center">Pick a mission above to instantly rebuild this screen around one goal.</div>';
  M(h);

function doneThisWeek(id){const now=new Date(),st=new Date(now);st.setDate(now.getDate()-((now.getDay()+6)%7));st.setHours(0,0,0,0);return S.history.some(x=>x.day===id&&new Date(x.date)>=st)}
